<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Taklif havolasi yaratish</title><link rel="stylesheet" href="style.css"></head><body><main class="maker"><a href="./">← Taklifnoma</a><p class="eyebrow">MEHMONLAR UCHUN</p><h1>Bitta taklif.<br>Alohida e’tibor.</h1><p>Umumiy havolani barcha mehmonlarga yuboring. Maxsus mehmon uchun ism va murojaatni yozing. Sayt mehmonning ismini avtomatik aniqlamaydi.</p><form id="form"><label for="mode">Taklif turi</label><select id="mode"><option value="general">Umumiy taklif</option><option value="honor">Ehtiromli shaxsiy taklif</option></select><label for="name">Ism va murojaat (ixtiyoriy)</label><input id="name" maxlength="140" placeholder="Anvar aka va oila a’zolari"><button class="pill">Havola yaratish ↗</button></form><output id="result" aria-live="polite"></output><a id="preview" class="pill" hidden target="_blank" rel="noopener">Ko‘rib chiqish ↗</a><button id="copy" class="pill" hidden>Nusxalash</button><p>Ism havolada ochiq ko‘rinadi. Bu sahifa maxfiy boshqaruv paneli emas.</p></main><script>
const result=document.getElementById('result'),preview=document.getElementById('preview'),copy=document.getElementById('copy');let link='';document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const url=new URL('./',location.href),name=document.getElementById('name').value.trim();if(name)url.searchParams.set('guest',name);if(document.getElementById('mode').value==='honor')url.searchParams.set('type','honor');link=url.href;result.textContent=link;preview.href=link;preview.hidden=false;copy.hidden=false;copy.textContent='Nusxalash';});copy.onclick=async()=>{try{await navigator.clipboard.writeText(link);copy.textContent='Nusxalandi ✓';}catch{result.textContent='Havolani belgilab nusxalang: '+link;}};
</script></body></html>
